name: Metrics
on:
  # Atualiza todo dia à meia-noite
  schedule: [{ cron: "0 0 * * *" }]
  # Permite rodar manualmente
  workflow_dispatch:
  # Roda quando der push na main
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # Arquivo de saída
          filename: metrics.svg
          # Tema pra combinar com o resto do perfil
          config_timezone: America/Sao_Paulo
          base: header, activity, community, repositories, metadata

          # Linguagens mais usadas (gráfico)
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Heatmap estilo calendário isométrico 3D
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Estatísticas gerais de atividade
          plugin_activity: yes
          plugin_activity_limit: 5

          # Conquistas / habilidades
          plugin_achievements: yes
          plugin_achievements_threshold: C
